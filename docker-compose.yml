services:
  postgres:
    image: postgres:15
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-payments}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-net

  payment-service:
    build:
      context: ./payments-service
      dockerfile: Dockerfile
    ports:
      - "${PAYMENT_SERVICE_PORT:-3001}:3001"
    env_file:
      - ./payments-service/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    env_file:
      - ./api-gateway/.env.docker
    depends_on:
      payment-service:
        condition: service_started
    networks:
      - app-net

volumes:
  pgdata:

networks:
  app-net:
    driver: bridge
